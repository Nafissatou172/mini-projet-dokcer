name: tasks

services:
  # Nginx est la seule porte d'entrée depuis l'extérieur
  proxy:
    image: nginx:1.27.2-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # L'appli Flask, construite à partir de app/Dockerfile
  web:
    build: ./app
    image: tasks-web:1.0
    environment:
      DB_HOST: db            # le nom du service suffit, Docker s'occupe de la résolution
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    # pas de ports publiés : seul nginx a besoin de la joindre
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # La base Postgres
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data   # là où Postgres range ses fichiers
    # pas de ports publiés non plus : personne n'a à se connecter à la base depuis l'hôte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
